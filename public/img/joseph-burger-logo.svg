<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#18181b" />
      <stop offset="50%" stopColor="#09090b" />
      <stop offset="100%" stopColor="#000000" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#fef08a" />
      <stop offset="40%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stopColor="#dc2626" />
      <stop offset="45%" stopColor="#ea580c" />
      <stop offset="85%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#fef08a" />
    </linearGradient>

    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="60%" stopColor="#d97706" />
      <stop offset="100%" stopColor="#b45309" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Border -->
  <circle cx="250" cy="250" r="235" fill="url(#bgDark)" stroke="url(#goldGrad)" stroke-width="8" />
  <circle cx="250" cy="250" r="222" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Circular Arch Text Top: LA ALBORAYA · BARRANQUILLA -->
  <path id="archTop" d="M 75 250 A 175 175 0 0 1 425 250" fill="none" />
  <text fill="#fbbf24" font-family="'Outfit', 'Impact', sans-serif" font-size="19" font-weight="800" letter-spacing="5">
    <textPath href="#archTop" startOffset="50%" text-anchor="middle">
      ★ HAMBURGUESERÍA ARTESANAL ★
    </textPath>
  </text>

  <!-- Circular Arch Text Bottom: BARRIO LA ALBORAYA -->
  <path id="archBottom" d="M 425 250 A 175 175 0 0 1 75 250" fill="none" />
  <text fill="#e4e4e7" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" letter-spacing="4">
    <textPath href="#archBottom" startOffset="50%" text-anchor="middle">
      • BARRIO LA ALBORAYA •
    </textPath>
  </text>

  <!-- Inner Badge Shield -->
  <g transform="translate(0, -10)">
    <!-- Back Flames -->
    <path d="M 250 85 C 235 125, 205 140, 220 175 C 205 155, 190 170, 195 190 C 180 180, 170 195, 175 210 C 180 230, 205 245, 250 245 C 295 245, 320 230, 325 210 C 330 195, 320 180, 305 190 C 310 170, 295 155, 280 175 C 295 140, 265 125, 250 85 Z"
          fill="url(#flameGrad)" filter="url(#glow)" opacity="0.95" />

    <!-- Core Burger Icon in Badge -->
    <g transform="translate(170, 150) scale(1)">
      <!-- Top Bun -->
      <path d="M 10 32 C 10 6, 150 6, 150 32 C 150 38, 10 38, 10 32 Z" fill="url(#bunGrad)" />
      <!-- Seeds -->
      <circle cx="45" cy="20" r="2.2" fill="#fef08a" />
      <circle cx="70" cy="14" r="2.2" fill="#fef08a" />
      <circle cx="95" cy="15" r="2.2" fill="#fef08a" />
      <circle cx="120" cy="24" r="2.2" fill="#fef08a" />
      <circle cx="80" cy="24" r="2.2" fill="#fef08a" />
      <circle cx="58" cy="26" r="2.2" fill="#fef08a" />

      <!-- Lettuce wave -->
      <path d="M 6 36 Q 20 44, 35 36 Q 50 44, 65 36 Q 80 44, 95 36 Q 110 44, 125 36 Q 140 44, 154 36 L 150 40 Q 130 48, 110 42 Q 90 48, 70 42 Q 50 48, 30 42 Q 15 48, 8 40 Z" fill="#22c55e" />

      <!-- Tomato Slice -->
      <path d="M 14 42 C 14 39, 146 39, 146 42 C 146 46, 14 46, 14 42 Z" fill="#ef4444" />

      <!-- Patty 1 (Smash) -->
      <rect x="8" y="47" width="144" height="11" rx="4" fill="#3f1a07" />

      <!-- Cheese Melt -->
      <path d="M 12 52 L 32 64 L 50 53 L 80 67 L 105 53 L 132 65 L 148 52 Z" fill="#facc15" />

      <!-- Patty 2 (Smash) -->
      <rect x="10" y="60" width="140" height="10" rx="4" fill="#291102" />

      <!-- Bottom Bun -->
      <path d="M 12 71 C 12 70, 148 70, 148 71 C 148 88, 12 88, 12 71 Z" fill="url(#bunGrad)" />
    </g>
  </g>

  <!-- Ribbon Banner for Brand Name -->
  <g transform="translate(0, 245)">
    <!-- Ribbon Shadow & Background -->
    <path d="M 60 48 L 440 48 L 420 108 L 80 108 Z" fill="#09090b" stroke="url(#goldGrad)" stroke-width="4" />
    <path d="M 60 48 L 30 78 L 60 108 L 80 108 L 60 48 Z" fill="#78350f" />
    <path d="M 440 48 L 470 78 L 440 108 L 420 108 L 440 48 Z" fill="#78350f" />

    <!-- Ribbon Center Fill -->
    <rect x="68" y="52" width="364" height="52" rx="4" fill="#18181b" />

    <!-- Main Title: JOSEPH BURGER -->
    <text x="250" y="90" text-anchor="middle"
          fill="url(#goldGrad)"
          font-family="'Outfit', 'Impact', sans-serif"
          font-size="42"
          font-weight="900"
          letter-spacing="2">
      JOSEPH BURGER
    </text>
  </g>

  <!-- Sub-banner tag: SMASH & GRILL -->
  <g transform="translate(0, 355)">
    <rect x="155" y="10" width="190" height="28" rx="14" fill="#ea580c" />
    <text x="250" y="29" text-anchor="middle"
          fill="#ffffff"
          font-family="'Plus Jakarta Sans', sans-serif"
          font-size="13"
          font-weight="800"
          letter-spacing="3">
      SMASH &amp; GRILL
    </text>
  </g>
</svg>
